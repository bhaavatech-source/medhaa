# .github/workflows/deploy-web.yml
# Builds and deploys the main MEDHAA web app (apps/web) to medhaa.net
# on every push to main. Same build artifact is reused by the Electron
# (Windows) and Capacitor (Android) wrappers in their own workflows.

name: Deploy Web App to medhaa.net

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace=apps/web

      - name: Build production bundle
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.medhaa.net
          NEXT_PUBLIC_GAMES_BASE_URL: https://games.medhaa.net

      - name: Deploy to Render (medhaa.net)
        uses: JorgeLNJunior/render-deploy@v1.4.5
        with:
          service_id: ${{ secrets.RENDER_WEB_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true
