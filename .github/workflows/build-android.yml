# .github/workflows/build-android.yml
# Builds the signed Android APK/AAB from the same web build, using
# Capacitor sync, whenever a release tag is pushed.

name: Build Android App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build --workspace=apps/web

      - name: Sync Capacitor Android project
        run: npx cap sync android
        working-directory: apps/android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build signed release AAB
        run: ./gradlew bundleRelease
        working-directory: apps/android/android
        env:
          MEDHAA_KEYSTORE_PASSWORD: ${{ secrets.MEDHAA_KEYSTORE_PASSWORD }}
          MEDHAA_KEY_ALIAS: ${{ secrets.MEDHAA_KEY_ALIAS }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: medhaa-android-release
          path: apps/android/android/app/build/outputs/bundle/release/*.aab
