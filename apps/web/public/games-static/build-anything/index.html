<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build Anything — Invent the Future</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>Build Anything</h1>
    <p class="subtitle">Invent the Future</p>
  </div>
<nav class="main-nav">
  <button class="tab-btn" data-tab="library">Discovery Library</button>
  <button class="tab-btn" data-tab="sandbox">Engineering Sandbox</button>
  <button class="tab-btn" data-tab="evaluation">📊 Evaluation</button>
  <button class="tab-btn" data-tab="life">✨ Bring to Life</button>
  <button class="tab-btn" data-tab="tech-quiz">🏆 Quiz Zone</button>
</nav>
  <div class="header-actions">
    <input type="text" id="globalSearch" placeholder="Search technologies..." />
    <button id="favToggle" title="Show favorites">★</button>
  </div>
</header>

<main id="appMain">

  <!-- SECTION 1: LIBRARY -->
  <section id="section-library" class="app-section active">
    <aside class="category-filter" id="categoryFilter"></aside>
    <div class="library-grid" id="libraryGrid"></div>
  </section>

  <!-- SECTION 2: SANDBOX -->
  <section id="section-sandbox" class="app-section">
    <div class="sandbox-layout">
      <div class="sandbox-palette" id="sandboxPalette">
        <h3>Drag technologies in →</h3>
        <div class="palette-list" id="paletteList"></div>
      </div>
      <div class="sandbox-workspace" id="sandboxWorkspace">
  <p class="workspace-hint" id="workspaceHint">Drop technologies here to invent something new</p>
</div>
<div class="part-settings-panel" id="partSettingsPanel">
  <h4>Configure Parts <span class="settings-hint">(tap a part to expand)</span></h4>
  <div class="selected-tech-tray" id="selectedTray"></div>
</div>

<!-- BHAVA AI GOAL HELPER -->
<div class="goal-panel" id="section-goal">
  <h3>🎯 Tell Bhava what you want to build</h3>
  <p class="goal-helper-text">
    Describe your idea. Bhava will suggest useful parts from the Sandbox.
  </p>

  <input
    type="text"
    id="goalInput"
    placeholder="Example: A small drone that takes photos"
  >

  <button id="goalSubmitBtn" class="primary-btn">
    ✨ Suggest Parts
  </button>

  <div id="goalResults" aria-live="polite"></div>
</div>

      <div class="mission-panel" id="missionPanel">
        <h3>Optional Mission</h3>
        <select id="missionSelect"></select>
        <p id="missionDesc"></p>
      </div>
    </div>
    <div class="sandbox-actions">
      <button id="evaluateBtn" class="primary-btn">Evaluate My Invention</button>
      <button id="clearBtn" class="secondary-btn">Clear Workspace</button>
    </div>
  </section>

  <!-- SECTION 3: EVALUATION -->
  <section id="section-evaluation" class="app-section">
    <div class="eval-header">
      <input type="text" id="deviceName" placeholder="Name your invention..." />
    </div>
    <div class="eval-grid" id="evalGrid"></div>
    <div class="eval-explain" id="evalExplain"></div>
    <button id="goLifeBtn" class="primary-btn">Bring It to Life</button>
  </section>

  <!-- SECTION 4: BRING TO LIFE -->
  <section id="section-life" class="app-section">
    <div class="stage-wrap">
      <div class="invention-stage" id="inventionStage"></div>
    </div>
    <button id="celebrateBtn" class="primary-btn">Complete Invention</button>
  </section>

</main>



<!-- Technology Detail Modal -->
<div id="techModal" class="modal hidden">
  <div class="modal-content" id="techModalContent"></div>
  <button class="modal-close" id="techModalClose">✕</button>
</div>

<!-- Celebration Overlay -->
<div id="celebrationOverlay" class="celebration hidden">
  <div class="celebration-content">
    <h2 id="celebrationTitle">Excellent Engineering!</h2>
    <div class="certificate" id="certificate"></div>
    <button id="closeCelebration" class="secondary-btn">Close</button>
  </div>
  <canvas id="confettiCanvas"></canvas>
</div>
<section id="quiz-level-select" class="screen hidden"></section>
<section id="quiz-question-screen" class="screen hidden"></section>
<section id="quiz-summary-screen" class="screen hidden"></section>

<script type="module" src="script.js"></script>
<script type="module" src="data/quizGenerator.js"></script>
<script src="../bhava-game-nav.js"></script>
</body>
</html>
