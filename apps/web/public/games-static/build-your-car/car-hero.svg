<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Build Your Car</title>
  <desc id="desc">A glossy teal compact car shown from the front and side.</desc>
  <defs>
    <linearGradient id="bodySide" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#b5fff0"/>
      <stop offset=".28" stop-color="#42d5d7"/>
      <stop offset=".7" stop-color="#1499bb"/>
      <stop offset="1" stop-color="#08617f"/>
    </linearGradient>
    <linearGradient id="bodyFront" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83f0e4"/>
      <stop offset=".55" stop-color="#23b9cc"/>
      <stop offset="1" stop-color="#08799d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d9ffff"/>
      <stop offset=".35" stop-color="#76cde5"/>
      <stop offset="1" stop-color="#244f72"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#334c5e"/>
      <stop offset=".45" stop-color="#111d2a"/>
      <stop offset="1" stop-color="#050b12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4ffff"/>
      <stop offset=".48" stop-color="#91b6c3"/>
      <stop offset="1" stop-color="#e4faff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#49e4d3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#49e4d3" stop-opacity=".5"/>
      <stop offset="1" stop-color="#49e4d3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.6" width="1.6" height="2.2">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M60 352h600" stroke="url(#road)" stroke-width="3"/>
  <ellipse cx="373" cy="332" rx="264" ry="25" fill="#030b12" opacity=".62" filter="url(#shadow)"/>
  <ellipse cx="373" cy="339" rx="245" ry="7" fill="#46daca" opacity=".2"/>

