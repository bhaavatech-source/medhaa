<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Brain of All Machines — Chip Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="top-nav">
      <div class="brand">🧠 <span>Brain of All Machines</span></div>

      <div class="progress-wrap" aria-label="Learning progress">
        <div id="progress-bar"></div>
      </div>

      <div class="nav-actions">
        <input
          id="search-input"
          type="text"
          placeholder="Search chips..."
          aria-label="Search chips"
        >
        <button id="badges-btn" title="Achievements" aria-label="Open achievements">
          🏆
        </button>
      </div>
    </header>

    <nav id="section-nav" aria-label="Main sections">
      <button class="nav-btn active" data-section="welcome">🌟 Welcome</button>
      <button class="nav-btn" data-section="history">🕰️ History</button>
      <button class="nav-btn" data-section="whatis">🔬 What Is A Chip</button>
      <button class="nav-btn" data-section="family">📚 Chip Family</button>
      <button class="nav-btn" data-section="everywhere">🌍 Chips Everywhere</button>
      <button class="nav-btn" data-section="flow">🔗 How Chips Talk</button>
      <button class="nav-btn" data-section="factory">🏭 Chip Factory</button>
      <button class="nav-btn" data-section="future">🚀 Future Chips</button>
      <button class="nav-btn" data-section="quiz">🎯 Quiz Adventure</button>
    </nav>

    <main id="stage"></main>

    <div id="toast" aria-live="polite"></div>

    <div id="badges-panel" class="hidden">
      <h3>
        Achievements
        <button id="close-badges" aria-label="Close achievements">✕</button>
      </h3>
      <div id="badges-list"></div>
    </div>

    <div id="chip-modal" class="hidden">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Chip details">
        <button id="close-modal" aria-label="Close chip details">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>

  </div>

  <script src="data/history.js"></script>
  <script src="data/chips.js"></script>
  <script src="data/devices.js"></script>
  <script src="data/quiz.js"></script>
  <script src="script.js"></script>
  
  
<script src="bhava-bridge.js"></script>
<script src="bhava-session.js"></script>
<script src="bhava-game-nav.js"></script>

  <script src="bhava-responsive.js"></script>
</body>
</html>
