    :root {

      --text: #eaf2ff;
      --muted: #9eb1d3;
      --accent: #60a5fa;
      --accent-2: #4ade80;
      --gold: #fbbf24;

      gap: 20px;

    }

    .nav, .content {

      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .nav {
      position: sticky;
      top: 20px;
      padding: 16px;
      max-height: calc(100vh - 40px);

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .logo {
      width: 42px; height: 42px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #93c5fd, #2563eb 60%, #0f172a 100%);

      position: relative; overflow: hidden;
      flex-shrink: 0;

    .logo:after {
      content: ""; position: absolute; inset: 8px;
      border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 50%;

    .brand h1 { font-size: 1.05rem; line-height: 1.2; margin: 0; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.78rem; }
    
    /* 3D Glass Progress Card */
    .progress-card {

      border-radius: 14px;
      background: linear-gradient(145deg, rgba(37,99,235,0.15), rgba(15,23,42,0.6));
      box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.1);
    }
    .progress-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.78rem; font-weight: 700; color: #dbeafe; margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%; height: 8px; background: rgba(255,255,255,0.08);
      border-radius: 999px; overflow: hidden; margin-bottom: 8px;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #4ade80);
      transition: width 0.4s ease;
    }
    .progress-message {
      font-size: 0.72rem; color: var(--muted); line-height: 1.3; margin: 0;
    }

    .cat-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      margin: 14px 0 6px 4px;
      font-weight: 700;
    }
    
    #sidebarNav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav button {
      width: 100%; text-align: left; background: var(--panel-2);
      color: var(--text); border: 1px solid var(--line);
      padding: 10px 12px; border-radius: 12px; margin: 0;
      cursor: pointer; transition: 0.2s ease; font-size: 0.88rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav button:hover { transform: translateY(-1px); border-color: rgba(96, 165, 250, 0.35); }
    .nav button.active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.42), rgba(15, 23, 42, 0.85));
      border-color: rgba(96, 165, 250, 0.6);
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.18) inset;
      font-weight: 600;
    }
    .num-badge {
      font-size: 0.7rem; background: rgba(255,255,255,0.08);
      padding: 2px 6px; border-radius: 999px; color: var(--muted);
    }

    .content {
      padding: 24px; min-height: 82vh; position: relative; overflow: hidden;

    .stars, .orbitRing { position: absolute; inset: 0; pointer-events: none; }
    .stars {

        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.7) 0 1px, transparent 1.2px),
        radial-gradient(circle at 55% 75%, rgba(255,255,255,0.8) 0 1px, transparent 1.2px),
        radial-gradient(circle at 28% 66%, rgba(255,255,255,0.55) 0 1px, transparent 1.2px),
        radial-gradient(circle at 72% 82%, rgba(255,255,255,0.55) 0 1px, transparent 1.2px);

    }
    .orbitRing:before {
      content: ""; position: absolute; right: -120px; top: -60px;
      width: 360px; height: 360px; border: 1px solid rgba(96, 165, 250, 0.14);
      border-radius: 50%; animation: spin 24s linear infinite;
    }

    .lesson-header { margin-bottom: 24px; position: relative; z-index: 2; }
    .eyebrow {
      display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px;
      border-radius: 999px; background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.22); font-size: 0.75rem;
      color: #cfe0ff; margin-bottom: 12px;

    .explore-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; border: 1px solid rgba(96, 165, 250, 0.5);
      padding: 10px 16px; border-radius: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.25s ease; font-size: 0.88rem;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      display: inline-flex; align-items: center; gap: 8px;

    .explore-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      border-color: rgba(147, 197, 253, 0.8);

      z-index: 2;

    .card {

    .card:hover {

      transform: translateY(-2px);

      margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
    }
    .card p { margin: 0; line-height: 1.6; font-size: 0.92rem; color: var(--muted); }

    .pipeline {

      margin-top: 10px; transition: 0.2s;

    .sim-output {

    .quiz-btn {

    .quiz-btn.correct { background: rgba(74, 222, 128, 0.18); border-color: var(--accent-2); color: #fff; }
    .quiz-btn.wrong { background: rgba(251, 113, 133, 0.18); border-color: var(--danger); }

    .failure-box { border-left: 3px solid var(--danger); }
    .repair-box { border-left: 3px solid var(--accent-2); }

    .myth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .myth-cell { padding: 10px; border-radius: 10px; font-size: 0.88rem; line-height: 1.5; }
    .myth-cell.myth { background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.25); }
    .myth-cell.fact { background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.25); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fadePage { animation: pageIn 0.35s ease; }

    @media (max-width: 960px) {

      .content { grid-row: 2; }

      .content, .nav { width: 100%; }
      #sidebarNav { display: none; gap: 4px; }
      #sidebarNav.expanded { display: flex; }
      #lesson-picker-toggle { display: flex; }

      .nav button { padding: 7px 10px; border-radius: 9px; font-size: 0.8rem; }
      .pedagogy-grid { grid-template-columns: 1fr; }
      .card.full-width { grid-column: span 1; }
      .myth-grid { grid-template-columns: 1fr; }
    }

    #lesson-picker-toggle { display: none; }
    @media (max-width: 960px) {
      #lesson-picker-toggle {
        display: flex; width: 100%; align-items: center; justify-content: space-between;
        margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
        border: 1px solid rgba(96,165,250,.35); background: #111d35;
        color: var(--text); font-size: .82rem; font-weight: 700; cursor: pointer;
      }
      #lesson-picker-toggle::after { content: '⌄'; font-size: 1.1rem; color: var(--accent); }
      #lesson-picker-toggle[aria-expanded="true"]::after { content: '⌃'; }
    }

    function updateProgress() {
      const completed = completedLessons.size;
      const total = curriculum.length;
      const percent = (completed / total) * 100;

      document.getElementById('progressText').textContent = `${completed} / ${total}`;
      document.getElementById('progressFill').style.width = `${percent}%`;

      document.getElementById('progressMessage').textContent =
        completed === total

     ************************************************************************/
    const sidebarNavEl = document.getElementById("sidebarNav");
    const lessonPickerToggle = document.getElementById("lesson-picker-toggle");

    lessonPickerToggle.addEventListener("click", () => {
      const expanded = sidebarNavEl.classList.toggle("expanded");
      lessonPickerToggle.setAttribute("aria-expanded", String(expanded));
    });

    function buildSidebar() {
      let currentCat = "";
      curriculum.forEach((item, index) => {
        if (item.cat !== currentCat) {
          currentCat = item.cat;
          const catHeader = document.createElement("div");
          catHeader.className = "cat-title";
          catHeader.textContent = currentCat;
          sidebarNavEl.appendChild(catHeader);
        }
        const btn = document.createElement("button");
        btn.dataset.id = item.id;
        btn.innerHTML = `<span>${item.title}</span>`;
        btn.addEventListener("click", () => selectLesson(item.id));
        sidebarNavEl.appendChild(btn);
      });
    }

    const pageEl = document.getElementById("page");

      const data = curriculum.find(item => item.id === id) || curriculum[0];

      const pipelineHtml = data.flow.map((step, idx) => {

    /************************************************************************
     * 4. INTERACTIVE WIDGET HANDLERS (SIMULATION & QUIZ)
     ************************************************************************/
    function runSimulation(id) {
      const data = curriculum.find(item => item.id === id);
      const outEl = document.getElementById(`sim-res-${id}`);
      if (!outEl || !data) return;
      outEl.style.color = "#fbbf24";
      outEl.textContent = "Executing orbital command... Processing telemetry...";
      setTimeout(() => {
        outEl.style.color = "#4ade80";
        outEl.textContent = data.simResult;
      }, 600);
    }

    function checkQuiz(btnEl, selectedIdx, correctIdx) {
      const msgEl = document.getElementById("quiz-msg");
      const parent = btnEl.parentElement;
      parent.querySelectorAll(".quiz-btn").forEach(b => b.classList.remove("correct", "wrong"));

      if (selectedIdx === correctIdx) {
        btnEl.classList.add("correct");
        msgEl.style.color = "#4ade80";
        msgEl.textContent = "✓ Correct! Excellent space systems knowledge!";
        
        // Progress update logic
        const activeId = location.hash.replace('#', '') || 'c1';
        completedLessons.add(activeId);
        updateProgress();
      } else {
        btnEl.classList.add("wrong");
        msgEl.style.color = "#fb7185";
        msgEl.textContent = "✗ Incorrect. Check 'How it works' and try again!";
      }
    }

    const validId = curriculum.some(item => item.id === initialHash) ? initialHash : "c1";
    selectLesson(validId);
