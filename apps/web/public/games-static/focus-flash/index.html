<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "LearningResource", "name": "Focus Flash", "description": "A shape appears and you must tap it before it vanishes, but only when it matches the current rule.", "url": "https://medhaa.net/games-static/focus-flash/index.html", "learningResourceType": "Educational Game", "teaches": ["Attention Span", "Reaction Speed", "Impulse Control"], "typicalAgeRange": "5-17", "isAccessibleForFree": true, "provider": {"@type": "Organization", "name": "Bhava Tech", "url": "https://medhaa.net"}}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../bhava-responsive.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- START SCREEN -->
    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">
      <button id="soundToggle" class="sound-btn" aria-label="Mute game sounds" title="Game sound effects">🔊</button>
      <h1 class="pop-in">🎯 Focus Flash</h1>

      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="selective" aria-pressed="true">🔎 Find the target</button>
        <button type="button" class="mode-tab" data-mode="sustained" aria-pressed="false">👁️ Watch and tap</button>
      </div>

      <p class="instructions" id="modeInstructions">Find the target before time runs out.</p>

      <div class="difficulty-picker" role="group" aria-label="Difficulty">
        <span>Difficulty</span>
        <div class="difficulty-options">
          <button type="button" class="difficulty-choice active" data-level="easy" aria-pressed="true">Easy</button>
          <button type="button" class="difficulty-choice" data-level="medium" aria-pressed="false">Medium</button>
          <button type="button" class="difficulty-choice" data-level="hard" aria-pressed="false">Hard</button>
        </div>
      </div>

      <button type="button" id="playBtn">Play</button>

      <details id="playerSettings" class="settings-panel">
        <summary>Options</summary>
        <div class="settings-grid">
          <label>Theme:
            <select id="themeSelect">
              <option value="shapes">Basic Shapes</option>
              <option value="space">Space Station</option>
              <option value="vehicles">Vehicles & Drones</option>
              <option value="chips">Electronic Chips</option>
            </select>
          </label>
          <label>Drifting
            <input type="checkbox" id="driftingToggle">
          </label>
          <label>Playstyle:
            <select id="playstyleSelect">
              <option value="standard">Standard</option>
              <option value="sprint">Sprint (Fast)</option>
              <option value="marathon">Marathon</option>
            </select>
          </label>
        </div>
      </details>

      <button id="progressBtn" class="secondary-btn">📊 View My Progress</button>
    </div>

    <!-- SELECTIVE ATTENTION GAME SCREEN (Side-by-Side Layout) -->
    <div id="gameScreen" class="screen">
      <button id="soundToggleGame" class="sound-btn" aria-label="Mute game sounds" title="Game sound effects">🔊</button>
      <div class="progress-bar-wrapper"><div id="progressBar"></div></div>
      
      <div class="game-layout-split">
        <!-- Sidebar for HUD and Mascot -->
        <div class="game-sidebar">
          <div class="hud">
            <div class="hud-item">Difficulty: <span id="hudDifficulty">1</span>/10</div>
            <div class="hud-item">Round: <span id="hudRound">0</span>/<span id="hudTotalRounds">0</span></div>
            <div class="hud-item">Score: <span id="hudScore">0</span></div>
            <div class="hud-item" id="timeWrapper">Time: <span id="hudTime">0</span>s</div>
          </div>
        </div>

        <!-- Main Play Area -->
        <div class="game-main">
          <div id="mascotArea"><img src="medha_logo_transparent.png" alt="Medhā" id="medhaaLogo"></div>
          <div id="targetBanner"></div>
          <div id="grid"></div>
          <div id="feedback"></div>
          <div id="comboPopup"></div>
          <div id="milestonePopup"></div>
          <div id="difficultyPopup"></div>
        </div>
      </div>
    </div>
    <!-- SUSTAINED ATTENTION (CPT) GAME SCREEN -->
   <div id="sustainedScreen" class="screen">
  <button id="soundToggleSustained" class="sound-btn" aria-label="Mute game sounds" title="Game sound effects">🔊</button>
  <div class="progress-bar-wrapper"><div id="sustainedProgressBar"></div></div>
  <div class="hud">
    <div class="hud-item">Difficulty <span id="sHudDifficulty">1</span>/10</div>
    <div class="hud-item">Trial <span id="sHudTrial">0</span>/<span id="sHudTotalTrials">0</span></div>
    <div class="hud-item">Score <span id="sHudScore">0</span></div>
  </div>
  <div id="sustainedRule"></div>
  <div id="sustainedStage">
    <div id="sustainedShapeWrap"></div>
  </div>
  <button id="tapTargetBtn">TAP if this is the target!</button>
  <div id="sustainedFeedback"></div>
</div>

    <!-- END SCREEN -->
    <div id="endScreen" class="screen">
      <div id="endStars" class="stars"></div>
      <h1 class="pop-in">Session Complete!</h1>
      <div class="stats" id="statsGrid">
        <div class="stat-box"><span id="statScore">0</span><label>Score</label></div>
        <div class="stat-box"><span id="statAccuracy">0%</span><label>Accuracy</label></div>
        <div class="stat-box"><span id="statAvgRT">0ms</span><label>Avg Reaction</label></div>
        <div class="stat-box"><span id="statFinalDifficulty">0</span><label>Final Difficulty</label></div>
      </div>
      <p id="attentionVerdict"></p>
      <button id="restartBtn">Play Again</button>
      <button id="viewProgressFromEnd" class="secondary-btn">📊 View Progress</button>
    </div>

    <!-- PROGRESS SCREEN -->
    <div id="progressScreen" class="screen">
      <h1 class="pop-in">📊 My Progress</h1>
      <p class="subtitle" id="progressSummary">Keep training to see trends!</p>
      <canvas id="progressChart" width="560" height="220"></canvas>
      <div id="historyTableWrap"></div>
      <button id="backFromProgress">Back</button>
      <button id="clearHistoryBtn" class="secondary-btn danger">Clear History</button>
    </div>

  </div>
<script src="script.js"></script>

  <script src="bhava-bridge.js"></script>
<script src="../bhava-session.js"></script>
<script src="../bhava-game-nav.js"></script>
  <script src="../bhava-responsive.js"></script>

</body>
</html>
