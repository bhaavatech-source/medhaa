<html lang="en" data-bhava-game="Akṣarābhyāsaḥ" data-bhava-mobile="off">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>अक्षराभ्यासः · Akṣarābhyāsaḥ — Learn to read and write Devanāgarī | Medhaa</title>
    <meta name="description" content="Learn to read and write Devanāgarī for Saṃskṛtam and Hindi: a three-level journey of letter games, word breakdown and stroke-by-stroke writing practice. Free on Medhaa." />
    <meta name="theme-color" content="#fff8f1" />
    <link rel="canonical" href="https://medhaa.net/games-static/devanagari-game/index.html" />
    <meta property="og:title" content="Akṣarābhyāsaḥ · Learn to Read &amp; Write Devanagari | Medhaa" />
    <meta property="og:description" content="Letter games, word breakdown and stroke-by-stroke writing practice for Sanskrit and Hindi." />
    <script type="module" crossorigin src="./assets/index-DxeZdyZy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-npE-ayct.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function textMatches(el) {
          var t = (el && el.textContent || '').replace(/\s+/g, ' ').trim();
          return /Numbers|संख्या|संख्याः/.test(t);
        }
        function findNumbersCard() {
          var els = document.querySelectorAll('button, a, div, span, li');
          for (var i = 0; i < els.length; i++) {
            var el = els[i];
            if (textMatches(el)) {
              var cl = (el.className || '').toString();
              if (/Numbers|संख्या|संख्याः/.test((el.textContent || '').replace(/\s+/g, ' '))) {
                return el;
              }
            }
          }
          return null;
        }

        function ensureLink() {
          if (document.querySelector('[data-bhava-samskritam-link]')) return;
          var card = findNumbersCard();
          if (!card) return;

          var parent = card.parentElement;
          if (!parent) return;

          var link = document.createElement('a');
          link.setAttribute('data-bhava-samskritam-link', 'true');
          link.href = 'https://samskritam.medhaa.net/';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.setAttribute('aria-label', 'Open Samskritam game');
          link.textContent = 'संस्कृतम् · Samskritam';

          link.style.display = 'inline-flex';
          link.style.alignItems = 'center';
          link.style.justifyContent = 'center';
          link.style.height = '52px';
          link.style.padding = '0 22px';
          link.style.marginLeft = '10px';
          link.style.border = '1.5px solid rgba(28, 37, 54, 0.22)';
          link.style.borderRadius = '999px';
          link.style.background = 'linear-gradient(180deg, rgba(255,255,255,0.96), rgba(244,246,250,0.9))';
          link.style.boxShadow = '0 8px 18px rgba(15, 23, 42, 0.08)';
          link.style.color = '#172033';
          link.style.fontWeight = '700';
          link.style.fontSize = '19px';
          link.style.fontFamily = 'Noto Sans Devanagari, Poppins, sans-serif';
          link.style.textDecoration = 'none';
          link.style.lineHeight = '1';
          link.style.cursor = 'pointer';
          link.style.transition = 'transform 150ms ease, box-shadow 150ms ease';
          link.style.whiteSpace = 'nowrap';

          if (card.nextElementSibling) {
            parent.insertBefore(link, card.nextElementSibling);
          } else {
            parent.appendChild(link);
          }

          var style = document.createElement('style');
          style.textContent =
            '[data-bhava-samskritam-link]:hover { transform: translateY(-1px); box-shadow: 0 12px 22px rgba(15, 23, 42, 0.12); }\n' +
            '[data-bhava-samskritam-link] { transition: transform 150ms ease, box-shadow 150ms ease; }';
          document.head.appendChild(style);
        }

        ensureLink();
        var observer = new MutationObserver(function () {
          ensureLink();
        });
        if (document.body) {
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        }
      })();
    </script>
    <!-- Shared host scripts stay external to this game's Vite bundle. -->
    <script src="../bhava-session.js"></script>
    <script src="../bhava-game-nav.js"></script>
  </body>
</html>
